
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef3f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #cccccc;
        }

        h2 {
            text-align: center;
            color: #234b78;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 16px;
            margin: 5px 3px 5px 0;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .submit-btn {
            background-color: #1769aa;
            margin-top: 20px;
        }

        .edit-btn {
            background-color: #e69500;
        }

        .delete-btn {
            background-color: #d93025;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #cccccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #1769aa;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f6fa;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Employee Registration</h2>

    <form id="employeeForm">
        <label for="name">Employee Name</label>
        <input type="text" id="name" required>

        <label for="empid">Employee ID</label>
        <input type="text" id="empid" required>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" required>

        <label for="state">State</label>
        <select id="state" required>
            <option value="">Select State</option>
            <option value="Kerala">Kerala</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Delhi">Delhi</option>
        </select>

        <button type="submit" class="submit-btn">
            Submit
        </button>

        <button type="button" id="cancelEdit" hidden>
            Cancel Edit
        </button>
    </form>

    <p id="message" aria-live="polite"></p>

    <h2>Registered Employees</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Employee ID</th>
                    <th>Date of Birth</th>
                    <th>State</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="employeeTable"></tbody>
        </table>
    </div>

</div>

<script>
    const form = document.getElementById("employeeForm");
    const table = document.getElementById("employeeTable");
    const message = document.getElementById("message");
    const cancelEditButton = document.getElementById("cancelEdit");
    const submitButton = form.querySelector(".submit-btn");

    // API address: Flask backend running on this same server
    const API_URL = "/api/employees";

    // Stores the database ID of the employee being edited
    let editingId = null;

    // Display a message to the user
    function showMessage(text, isError = false) {
        message.style.color = isError ? "red" : "green";
        message.textContent = text;
    }

    // Send requests to Flask and handle API errors
    async function apiRequest(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            headers: {
                "Content-Type": "application/json",
                ...(options.headers || {})
            }
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Request failed");
        }

        return data;
    }

    // Load employees saved in the SQLite database
    async function loadEmployees() {
        table.innerHTML = "";

        try {
            const employees = await apiRequest(API_URL);

            if (employees.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");

                cell.colSpan = 5;
                cell.textContent = "No employees registered yet.";

                row.appendChild(cell);
                table.appendChild(row);
                return;
            }

            employees.forEach(function(employee) {
                const row = document.createElement("tr");

                const details = [
                    employee.name,
                    employee.empid,
                    employee.dob,
                    employee.state
                ];

                details.forEach(function(value) {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                // Create Edit button
                const actions = document.createElement("td");

                const editButton = document.createElement("button");
                editButton.type = "button";
                editButton.className = "edit-btn";
                editButton.textContent = "Edit";

                editButton.addEventListener("click", function() {
                    document.getElementById("name").value =
                        employee.name;

                    document.getElementById("empid").value =
                        employee.empid;

                    document.getElementById("dob").value =
                        employee.dob;

                    document.getElementById("state").value =
                        employee.state;

                    editingId = employee.id;

                    submitButton.textContent = "Update Employee";
                    cancelEditButton.hidden = false;

                    showMessage(
                        "Edit the details and click Update Employee.",
                        false
                    );

                    form.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });
                });

                // Create Delete button
                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "Delete";

                deleteButton.addEventListener("click", async function() {
                    if (!confirm(
                        "Are you sure you want to delete " +
                        employee.name + "?"
                    )) {
                        return;
                    }

                    try {
                        await apiRequest(
                            API_URL + "/" + employee.id,
                            { method: "DELETE" }
                        );

                        if (editingId === employee.id) {
                            resetForm();
                        }

                        showMessage("Employee deleted successfully.");
                        await loadEmployees();

                    } catch (error) {
                        showMessage(error.message, true);
                    }
                });

                actions.appendChild(editButton);
                actions.appendChild(deleteButton);

                row.appendChild(actions);
                table.appendChild(row);
            });

        } catch (error) {
            showMessage(
                "Could not load employees. Check whether Flask is running. " +
                error.message,
                true
            );
        }
    }

    // Register a new employee or update an existing employee
    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const employee = {
            name: document.getElementById("name").value.trim(),
            empid: document.getElementById("empid").value.trim(),
            dob: document.getElementById("dob").value,
            state: document.getElementById("state").value
        };

        if (
            !employee.name ||
            !employee.empid ||
            !employee.dob ||
            !employee.state
        ) {
            showMessage("Please fill in all fields.", true);
            return;
        }

        try {
            let result;

            if (editingId === null) {
                // POST: Save a new employee in the database
                result = await apiRequest(API_URL, {
                    method: "POST",
                    body: JSON.stringify(employee)
                });

                showMessage(result.message);

            } else {
                // PUT: Update the selected employee in the database
                result = await apiRequest(
                    API_URL + "/" + editingId,
                    {
                        method: "PUT",
                        body: JSON.stringify(employee)
                    }
                );

                showMessage(result.message);
            }

            resetForm();
            await loadEmployees();

        } catch (error) {
            showMessage(error.message, true);
        }
    });

    // Reset the form and exit edit mode
    function resetForm() {
        form.reset();
        editingId = null;
        submitButton.textContent = "Submit";
        cancelEditButton.hidden = true;
    }

    cancelEditButton.addEventListener("click", function() {
        resetForm();
        showMessage("Edit cancelled.");
    });

    // Load saved employees when the page opens
    loadEmployees();
</script>

</body>
</html>
